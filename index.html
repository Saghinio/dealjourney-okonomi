function setSyncStatus(msg){const el=document.getElementById('syncStatus');if(el)el.textContent=msg;}

async function sbFetch(path,opts={}){

const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{...SB_HDR,...(opts.headers||{})}});

if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.message||err.hint||'HTTP '+r.status);}

if(r.status===204)return null;

return r.json();

}

async function sbUpsert(table,item){

try{await sbFetch(table+'?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(item)});setSyncStatus('☁️ Lagret');}

catch(err){toast('Lagringsfeil: '+err.message);}

}

async function sbUpsertMany(table,items){

if(!items.length)return;

try{await sbFetch(table+'?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(items)});setSyncStatus('☁️ Lagret');}

catch(err){toast('Lagringsfeil: '+err.message);}

}

async function sbDelete(table,id){

try{await sbFetch(table+'?id=eq.'+encodeURIComponent(id),{method:'DELETE'});setSyncStatus('☁️ Lagret');}

let S={utlegg:[],fakturaer:[],tab:'oversikt',filterManed:'alle',impTarget:'auto',impLog:[],showLog:false,euId:null,efId:null,bp:null,impPreview:null};

/* ── UTILS ──────────────────────────────────────────────────────── */

function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function nok(v){return new Intl.NumberFormat('nb-NO',{style:'currency',currency:'NOK'}).format(v||0);}

function today(){return new Date().toISOString().slice(0,10);}

function getManed(dato){if(!dato)return'';const p=dato.split('-');if(p.length<2)return'';const d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])||1);if(isNaN(d))return'';const s=d.toLocaleDateString('nb-NO',{month:'long',year:'numeric'});return s[0].toUpperCase()+s.slice(1);}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

/* ── LOAD DATA ───────────────────────────────────────────────────── */

async function loadData(){

setSyncStatus('☁️ Laster...');

try{

const[utleggData,fakturaData]=await Promise.all([

sbFetch('utlegg?select=*&order=dato.asc'),

sbFetch('fakturaer?select=*&order=fakturadato.asc')

]);

if(!utleggData.length&&!fakturaData.length){

setSyncStatus('☁️ Laster inn startdata...');

await Promise.all([sbUpsertMany('utlegg',INIT_U),sbUpsertMany('fakturaer',INIT_F)]);

S.utlegg=[...INIT_U];S.fakturaer=[...INIT_F];

} else {

S.utlegg=utleggData.map(u=>({...u,belop:parseFloat(u.belop)||0}));

S.fakturaer=fakturaData.map(f=>({...f,fakturabelop:parseFloat(f.fakturabelop)||0,netto:parseFloat(f.netto)||0}));

}

setSyncStatus('☁️ Synkronisert');

}catch(err){

setSyncStatus('⚠️ Tilkoblingsfeil');

toast('Kunne ikke laste data: '+err.message);

S.utlegg=[];S.fakturaer=[];

}

initMonths();goTab('oversikt');

}

function goTab(tab){

S.tab=tab;

document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['oversikt','utlegg','fakturaer','import'][i]===tab));

const ab=document.getElementById('addBtn');

if(tab==='utlegg'){ab.textContent='+ Utlegg';ab.style.display='';}

else if(tab==='fakturaer'){ab.textContent='+ Faktura';ab.style.display='';}

else ab.style.display='none';

render();

}

function render(){

function renderOversikt(){

const kpiHtml=`<div class="kpi-grid">${kpis.map(k=>`<div class="kpi"><div class="kpi-lbl">${k.l}</div><div class="kpi-val" style="color:${k.c}">${k.v}</div><div class="kpi-sub">${k.s}</div></div>`).join('')}</div>`;

const mRows=MANEDER.map(m=>{

}).join('');

const mthHtml=`<div class="card"><div class="card-hdr"><div class="card-title">Månedlig oversikt</div></div><div class="table-scroll"><table><thead><tr><th>Måned</th><th style="text-align:right">Utlegg</th><th style="text-align:right">Netto fakturert</th><th style="text-align:right">Betalt inn</th><th style="text-align:right">Netto</th></tr></thead><tbody>${mRows}<tr class="mth-tot"><td>TOTALT</td><td style="text-align:right;color:#dc2626">${nok(tU)}</td><td style="text-align:right;color:#3b82f6">${nok(tN)}</td><td style="text-align:right;color:#16a34a">${nok(tB)}</td><td style="text-align:right;color:${tR>=0?'#16a34a':'#dc2626'}">${nok(tR)}</td></tr></tbody></table></div></div>`;

const catMap={};S.utlegg.forEach(u=>catMap[u.kategori]=(catMap[u.kategori]||0)+u.belop);

function bindCells(){

document.querySelectorAll('.editable').forEach(td=>td.addEventListener('click',()=>startEdit(td)));

document.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',()=>toggleBetalt(el.dataset.toggle)));

}

function startEdit(td){

const{dt,id,f,ft,opts}=td.dataset;

const item=(dt==='u'?S.utlegg:S.fakturaer).find(x=>x.id===id);if(!item)return;

let el;

if(ft==='select'){el=document.createElement('select');el.className='inline-sel';(opts||'').split('|').forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;if(o===item[f])op.selected=true;el.appendChild(op);});}

else{el=document.createElement('input');el.className='inline-inp';el.type=ft||'text';el.value=item[f]||'';}

const commit=()=>{if(el.value==='__ny__'){const k=addKategori();patch(dt,id,f,k||item[f]);render();return;}const v=ft==='number'?(parseFloat(el.value)||0):el.value;patch(dt,id,f,v);render();};

el.addEventListener('blur',commit);

el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key==='Escape')el.blur();});

td.innerHTML='';td.appendChild(el);el.focus();

}

function patch(dt,id,field,val){

let updated;

if(dt==='u'){S.utlegg=S.utlegg.map(u=>{if(u.id!==id)return u;const x={...u,[field]:val};if(field==='dato')x.maned=getManed(val);updated=x;return x;});}

else{S.fakturaer=S.fakturaer.map(f=>{if(f.id!==id)return f;const x={...f,[field]:val};if(field==='fakturadato')x.maned=getManed(val);if(field==='betalt'&&val==='Ja'&&!x.betalingsdato)x.betalingsdato=today();if(field==='betalt'&&val==='Nei')x.betalingsdato='';updated=x;return x;});}

if(updated){setSyncStatus('☁️ Lagrer...');sbUpsert(dt==='u'?'utlegg':'fakturaer',updated);}

}

function toggleBetalt(id){const f=S.fakturaer.find(x=>x.id===id);if(!f)return;patch('f',id,'betalt',f.betalt==='Ja'?'Nei':'Ja');render();}

function delItem(dt,id){

if(!confirm('Slett denne posten?'))return;

if(dt==='u')S.utlegg=S.utlegg.filter(x=>x.id!==id);else S.fakturaer=S.fakturaer.filter(x=>x.id!==id);

setSyncStatus('☁️ Lagrer...');sbDelete(dt==='u'?'utlegg':'fakturaer',id);render();toast('Slettet');

}

function openModal(id){document.getElementById(id).classList.add('open');}

function closeModal(id){document.getElementById(id).classList.remove('open');}

function dzOver(ev){ev.preventDefault();document.getElementById('dropZone')?.classList.add('over');}

function dzLeave(){document.getElementById('dropZone')?.classList.remove('over');}

function dzDrop(ev){ev.preventDefault();dzLeave();Array.from(ev.dataTransfer.files).forEach(processFile);}

function handleFiles(inp){Array.from(inp.files).forEach(processFile);inp.value='';}

function logEntry(n,s,m){S.impLog.unshift({n,s,m,t:new Date().toLocaleTimeString('nb-NO')});}

function processFile(file){

const ext=file.name.split('.').pop().toLowerCase();

if(ext==='csv'){

const r=new FileReader();

r.onload=ev=>{

try{

const lines=ev.target.result.trim().split('\n').filter(Boolean);

if(lines.length<2){logEntry(file.name,'warn','Ingen data');S.showLog=true;render();return;}

const sep=lines[0].includes(';')?';':',';

const hdrs=lines[0].split(sep).map(h=>h.replace(/^"|"$/g,'').trim());

const rows=lines.slice(1).map(l=>{const cs=l.split(sep).map(c=>c.replace(/^"|"$/g,'').trim());const o={};hdrs.forEach((h,i)=>o[h]=cs[i]||'');return o;});

const hasKunde=hdrs.some(h=>h.toLowerCase().includes('kunde'));

const tgt=S.impTarget==='auto'?(hasKunde?'fakturaer':'utlegg'):S.impTarget;

if(tgt==='fakturaer'){const p=rows.map(csvToF).filter(f=>f.kunde);S.impPreview={items:p.map((x,i)=>({...x,_checked:true,_idx:i})),type:'fakturaer',fileName:file.name};logEntry(file.name,'ok',p.length+' fakturaer klar til gjennomgang');}

else{const p=rows.map(csvToU).filter(u=>u.beskrivelse&&u.belop>0);S.impPreview={items:p.map((x,i)=>({...x,_checked:true,_idx:i})),type:'utlegg',fileName:file.name};logEntry(file.name,'ok',p.length+' utgifter funnet – velg hvilke som skal inn');}

S.showLog=true;render();

}catch(err){logEntry(file.name,'err','Feil: '+err.message);S.showLog=true;render();}

};r.readAsText(file,'utf-8');

} else if(['png','jpg','jpeg','gif','webp','heic'].includes(ext)){

const r=new FileReader();

r.onload=ev=>{const base64=ev.target.result.split(',')[1];const mimeType=file.type||'image/jpeg';S.bp={url:`data:${mimeType};base64,${base64}`,type:S.impTarget==='auto'?'fakturaer':S.impTarget,file:file.name,rows:[],base64,mimeType};showBP();};

r.readAsDataURL(file);logEntry(file.name,'ok','Bilde åpnet for import');

} else if(ext==='pdf'){

const tgt=S.impTarget==='auto'?'fakturaer':S.impTarget;

if(tgt==='fakturaer'){const f={id:uid(),fakturanr:'',kunde:'PDF – '+file.name,fakturadato:today(),forfallsdato:null,fakturabelop:0,netto:0,betalt:'Nei',betalingsdato:null,maned:getManed(today())};S.fakturaer.push(f);sbUpsert('fakturaer',f);}

else{const u={id:uid(),dato:today(),beskrivelse:'PDF – '+file.name,kategori:'Annet',belop:0,referanse:'',maned:getManed(today())};S.utlegg.push(u);sbUpsert('utlegg',u);}

logEntry(file.name,'ok','PDF lagt til – fyll inn detaljer');S.showLog=true;render();

} else{logEntry(file.name,'err','Filformat ikke støttet');S.showLog=true;render();}

}

function guessKategori(desc){const d=(desc||'').toLowerCase();if(d.includes('openai')||d.includes('chatgpt')||d.includes('claude.ai')||d.includes('anthropic')||d.includes('cursor')||d.includes('paddle')||d.includes('artlist')||d.includes('github')||d.includes('subscription')||d.includes('abonnement'))return'Programvare/SaaS';if(d.includes('airbnb')||d.includes('hotell')||d.includes('hotel'))return'Overnatting';if(d.includes('fly')||d.includes('flytog')||d.includes('parkfly')||d.includes('sas ')||d.includes('norwegian '))return'Reise';if(d.includes('mcd')||d.includes('bakeri')||d.includes('rema')||d.includes('edgars')||d.includes('storcash')||d.includes('sangbert')||d.includes('slakter')||d.includes('rice')||d.includes('mat ')||d.includes('herlig land')||d.includes('europris')||d.includes('norli')||d.includes('bønder'))return'Mat/Bevertning';if(d.includes('telavox')||d.includes('posten')||d.includes('tele')||d.includes('mobil'))return'Telefoni/Kommunikasjon';if(d.includes('fiken')||d.includes('network')||d.includes('homesourcing')||d.includes('butikkhjelp')||d.includes('puls ')||d.includes('konsulent'))return'Konsulentjenester';if(d.includes('apple.com')||d.includes('clas ohl')||d.includes('div'))return'Diverse';if(d.includes('lønn')||d.includes('lønnsutbetaling'))return'Lønn';if(d.includes('skatteet')||d.includes('innkrevings'))return'Skatt';return'Annet';}

function csvToU(row){const ks=Object.keys(row);const g=(...a)=>{for(const al of a){const k=ks.find(k=>k.toLowerCase().includes(al));if(k&&row[k]!=='')return row[k];}return'';};const dato=String(g('dato','date')||today()).substring(0,10);const besk=String(g('beskr','desc','tekst','name','navn')||'').trim();const kat=String(g('kat','cat','kategori')||'').trim()||guessKategori(besk);return{id:uid(),dato,beskrivelse:besk,kategori:kat||'Annet',belop:parseFloat(String(g('beløp','belop','amount','sum','total','pris','ut')).replace(/[^\d.,-]/g,'').replace(',','.'))||0,referanse:String(g('ref','kv','voucher','referanse')||'').trim(),maned:getManed(dato)};}

function csvToF(row){const ks=Object.keys(row);const g=(...a)=>{for(const al of a){const k=ks.find(k=>k.toLowerCase().includes(al));if(k&&row[k]!=='')return row[k];}return'';};const dato=String(g('fakturadato','dato','date','issued')||today()).substring(0,10);const belop=parseFloat(String(g('faktura','amount','total','sum','belop','beløp')).replace(/[^\d.,-]/g,'').replace(',','.'))||0;return{id:uid(),fakturanr:String(g('fakturanr','invoice','nr','number')||'').trim(),kunde:String(g('kunde','customer','client','name','navn')||'').trim(),fakturadato:dato,forfallsdato:String(g('forfall','due')||'')||null,fakturabelop:belop,netto:parseFloat(String(g('netto','net')).replace(/[^\d.,-]/g,'').replace(',','.'))||(Math.round(belop/1.25*100)/100),betalt:String(g('betalt','paid','status')||'Nei'),betalingsdato:String(g('betalingsdato','payment','paid_date')||'')||null,maned:getManed(dato)};}

function togglePreviewRow(idx,val){if(S.impPreview)S.impPreview.items.forEach(x=>{if(x._idx===idx)x._checked=val;});render();}

function toggleAllPreview(val){if(S.impPreview)S.impPreview.items.forEach(x=>x._checked=val);render();}

function prevEditKat(idx,val){if(S.impPreview)S.impPreview.items.forEach(x=>{if(x._idx===idx)x.kategori=val;});render();}

async function confirmImport(){

const prev=S.impPreview;if(!prev)return;

const iF=prev.type==='fakturaer';

const chosen=prev.items.filter(x=>x._checked).map(x=>{const c={...x};delete c._checked;delete c._idx;return c;});

if(!chosen.length){toast('Ingen rader valgt');return;}

if(iF){S.fakturaer=[...S.fakturaer,...chosen];await sbUpsertMany('fakturaer',chosen);}

else{S.utlegg=[...S.utlegg,...chosen];await sbUpsertMany('utlegg',chosen);}

logEntry(prev.fileName,'ok',chosen.length+' '+( iF?'fakturaer':'utlegg')+' importert ✓');

S.impPreview=null;S.showLog=true;

toast(chosen.length+' poster lagret ✓');goTab(prev.type);

}

document.getElementById('bpOverlay')?.remove();

const bp=S.bp;if(!bp)return;

const iF=bp.type==='fakturaer';

const div=document.createElement('div');div.className='bp-overlay';div.id='bpOverlay';

div.innerHTML=`<div class="bp-left"><div class="bp-left-hdr"><span style="color:white;font-weight:600;font-size:14px">📷 ${esc(bp.file)}</span><span style="color:#64748b;font-size:12px">${bp.rows.length} rader lagt til</span></div><div class="bp-img-wrap"><img src="${bp.url}" alt="Import"></div>${bp.rows.length?`<div class="bp-added"><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:6px;text-transform:uppercase">Lagt til (${bp.rows.length})</div>${addedList}</div>`:''}</div><div class="bp-right"><div class="bp-right-hdr"><div><div style="font-weight:600;color:#0f172a;font-size:15px">${iF?'🧾 Legg inn faktura':'💸 Legg inn utlegg'}</div><div style="font-size:12px;color:#94a3b8;margin-top:2px">Fyll inn fra bildet til venstre</div></div><button onclick="closeBP()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8">&times;</button></div><div class="bp-form"><div class="ai-hint" id="aiHint"></div><button class="ai-btn" id="aiBtn" onclick="doAI()"><div class="ai-spin" id="aiSpin"></div>✨ Les av med AI automatisk</button>${form}</div><div class="bp-actions"><button onclick="bpAddRow()" style="padding:10px;font-size:13px;font-weight:600;background:#eff6ff;color:#3b82f6;border:1px solid #bfdbfe;border-radius:8px;cursor:pointer;font-family:inherit">+ Legg til rad og fortsett</button><button onclick="bpSaveAll()" style="padding:10px;font-size:13px;font-weight:600;background:#3b82f6;color:white;border:none;border-radius:8px;cursor:pointer;font-family:inherit">✓ Lagre alle (${bp.rows.length}) og lukk</button></div></div>`;

document.body.appendChild(div);

}

function bpGetRad(){

const iF=S.bp.type==='fakturaer';

if(iF){const belop=parseFloat(document.getElementById('bp-belop')?.value)||0;const nettoInp=parseFloat(document.getElementById('bp-netto')?.value)||0;return{id:uid(),fakturanr:document.getElementById('bp-nr')?.value||'',kunde:document.getElementById('bp-kunde')?.value||'',fakturadato:document.getElementById('bp-dato')?.value||today(),forfallsdato:document.getElementById('bp-forfall')?.value||null,fakturabelop:belop,netto:nettoInp||(Math.round(belop/1.25*100)/100),betalt:document.getElementById('bp-betalt')?.value||'Nei',betalingsdato:null,maned:getManed(document.getElementById('bp-dato')?.value||today())};}

function bpAddRow(){const r=bpGetRad();const iF=S.bp.type==='fakturaer';if(!(iF?r.kunde:r.beskrivelse)){toast('Fyll ut minst leverandør/beskrivelse');return;}S.bp.rows.push(r);showBP();}

function bpRemRow(i){S.bp.rows.splice(i,1);showBP();}

function bpSaveAll(){

const bp=S.bp,last=bpGetRad(),iF=bp.type==='fakturaer';

let all=[...bp.rows];if(iF?last.kunde:last.beskrivelse)all.push(last);

if(!all.length){toast('Ingen rader å lagre');return;}

if(iF){const valid=all.filter(r=>r.kunde);S.fakturaer=[...S.fakturaer,...valid];sbUpsertMany('fakturaer',valid);}

else{const valid=all.filter(r=>r.beskrivelse);S.utlegg=[...S.utlegg,...valid];sbUpsertMany('utlegg',valid);}

closeBP();goTab(bp.type);toast(all.length+' poster lagret ✓');

}

async function doAI(){

const bp=S.bp;if(!bp)return;

const hint=document.getElementById('aiHint');

const apiKey=localStorage.getItem('dj_anthropic_key')||'';

if(!apiKey){if(hint){hint.textContent='Trenger Anthropic API-nøkkel. Klikk ⚙ øverst til høyre.';hint.style.background='#fef3c7';hint.style.borderColor='#fde68a';hint.style.color='#92400e';hint.classList.add('show');}return;}

const btn=document.getElementById('aiBtn');

if(btn){btn.disabled=true;btn.classList.add('loading');}

if(hint){hint.textContent='Analyserer bildet...';hint.style.background='#eff6ff';hint.style.borderColor='#bfdbfe';hint.style.color='#1d4ed8';hint.classList.add('show');}

try{

const iF=bp.type==='fakturaer';

const prompt=iF?`Du leser fakturainformasjon fra et bilde. Ekstrahér ALLE fakturaer og returner KUN et JSON-array:\n[{"fakturanr":"","kunde":"","fakturadato":"YYYY-MM-DD","forfallsdato":"YYYY-MM-DD eller null","fakturabelop":0,"netto":0,"betalt":"Nei"}]\nReturner bare arrayet.`:`Du leser kvitteringer fra et bilde. Ekstrahér alle poster:\n[{"beskrivelse":"","kategori":"Annet","dato":"YYYY-MM-DD","belop":0,"referanse":""}]\nReturner bare JSON-arrayet.`;

const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':apiKey,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1024,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:bp.mimeType,data:bp.base64}},{type:'text',text:prompt}]}]})});

if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.error?.message||'API-feil '+res.status);}

const data=await res.json();const resStr=data.content[0].text;

const arrM=resStr.match(/\[[\s\S]*\]/),objM=resStr.match(/\{[\s\S]*\}/);

let items=[];

if(arrM){const p=JSON.parse(arrM[0]);items=Array.isArray(p)?p:[p];}else if(objM){items=[JSON.parse(objM[0])];}else throw new Error('Ingen data i svaret');

const newRows=items.map(d=>iF?{id:uid(),fakturanr:d.fakturanr||'',kunde:d.kunde||'',fakturadato:d.fakturadato&&d.fakturadato!=='null'?d.fakturadato:today(),forfallsdato:d.forfallsdato&&d.forfallsdato!=='null'?d.forfallsdato:null,fakturabelop:parseFloat(d.fakturabelop)||0,netto:(()=>{const fb=parseFloat(d.fakturabelop)||0;const n=parseFloat(d.netto)||0;return n&&n!==fb?n:Math.round(fb/1.25*100)/100;})(),betalt:d.betalt||'Nei',betalingsdato:null,maned:getManed(d.fakturadato||today())}:{id:uid(),dato:d.dato&&d.dato!=='null'?d.dato:today(),beskrivelse:d.beskrivelse||'',kategori:d.kategori||'Annet',belop:parseFloat(d.belop)||0,referanse:d.referanse||'',maned:getManed(d.dato||today())});

S.bp.rows=[...S.bp.rows,...newRows];

if(hint){hint.textContent=`✅ ${newRows.length} ${iF?'faktura(er)':'post(er)'} lest av`;hint.classList.add('show');}

toast(`✨ ${newRows.length} poster funnet`);showBP();

}catch(err){if(hint){hint.textContent='Kunne ikke lese: '+err.message;}toast('AI-feil: '+err.message);}

finally{if(btn){btn.disabled=false;btn.classList.remove('loading');}}

}

function openSettings(){document.getElementById('settingsKey').value=localStorage.getItem('dj_anthropic_key')||'';openModal('settingsModal');}

function saveSettings(){const k=document.getElementById('settingsKey').value.trim();if(k)localStorage.setItem('dj_anthropic_key',k);else localStorage.removeItem('dj_anthropic_key');closeModal('settingsModal');toast(k?'API-nøkkel lagret ✓':'API-nøkkel fjernet');}

function toggleExportMenu(ev){ev.stopPropagation();document.getElementById('expMenu').classList.toggle('open');}

document.addEventListener('click',()=>document.getElementById('expMenu')?.classList.remove('open'));

function doExport(type){

const data=type==='utlegg'?S.utlegg:S.fakturaer;

if(!data.length){toast('Ingen data å eksportere');return;}

const keys=Object.keys(data[0]).filter(k=>k!=='id');

const csv=[keys,...data.map(r=>keys.map(k=>'"'+String(r[k]||'').replace(/"/g,'""')+'"'))].map(r=>r.join(';')).join('\n');

const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));

a.download=`DealJourney_${type}_${today()}.csv`;a.click();

document.getElementById('expMenu').classList.remove('open');toast('Eksportert');

}

function initMonths(){

const sel=document.getElementById('monthSel');

sel.innerHTML='<option value="alle">Alle måneder</option>';

MANEDER.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;sel.appendChild(o);});

}

loadData();

</script>
